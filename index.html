<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VR4 – Entraînements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
<header class="topbar no-print">
  <h1>VR4</h1>
  <span id="stats" class="stats"></span>
  <div class="btn-group">
    <button id="btn-export" title="Télécharger l'entraînement (JSON)">Exporter</button>
    <button id="btn-import" title="Importer un entraînement (JSON)">Importer</button>
    <button id="btn-print">Imprimer</button>
  </div>
  <button id="btn-palette" class="mobile-only">Figures</button>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
</header>

<div class="layout">
  <main id="session"></main>
  <aside id="palette" class="no-print">
    <div class="palette-head">
      <div class="palette-filters">
        <input id="search" type="search" placeholder="Rechercher (A, 12…)">
      </div>
    </div>
    <div id="palette-list"></div>
  </aside>
</div>

<div id="viewer" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
