<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VR – Entraînements</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#161b26">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VR">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=30">
</head>
<body>
<header class="topbar no-print">
  <h1>VR</h1>
  <span id="stats" class="stats"></span>
  <div class="btn-group">
    <button id="btn-share" title="Copier le lien de cet entraînement"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span id="share-label">Copier</span></button>
  </div>
  <button id="btn-palette" class="mobile-only">Figures</button>
</header>

<div class="layout">
  <main id="session"></main>
  <aside id="palette" class="no-print">
    <div id="palette-pull" class="palette-pull" title="Tirer pour agrandir ou réduire"><span></span></div>
    <div class="palette-head">
      <div class="palette-filters">
        <input id="search" type="search" placeholder="Rechercher (A, 12…)">
      </div>
    </div>
    <div id="palette-list"></div>
  </aside>
</div>

<div id="card" class="card-overlay no-print" hidden></div>

<div id="viewer" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
