<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VR4 – Choix du modèle de parachutiste</title>
<link rel="stylesheet" href="css/style.css?v=2">
<style>
  body { display: block; padding: 20px 24px 60px; }
  h1 { margin: 0 0 4px; }
  .intro { color: var(--muted); margin: 0 0 20px; }
  .design { background: var(--card); border-radius: 10px; padding: 12px 16px 16px; margin-bottom: 16px; }
  .design h2 { margin: 0; font-size: 18px; }
  .design h2 span { color: var(--accent); margin-right: 6px; }
  .design p { margin: 2px 0 10px; color: var(--muted); font-size: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .tile { --fs: 200px; }
  .tile .frame { width: var(--fs); }
  .tile small { display: block; text-align: center; color: var(--muted); font-size: 12px; margin-top: 3px; }
  .solo { --fs: 200px; }
</style>
</head>
<body>
<h1>Choisir le modèle de parachutiste</h1>
<p class="intro">Chaque modèle est un corps unique, identique pour les 4 parachutistes (seules la couleur, la position et la rotation changent), parfaitement symétrique. Indiquez le numéro de celui que vous préférez.</p>
<div id="designs"></div>

<script type="module">
  import { DESIGNS, drawJumperWith, el } from "./js/designs.js";
  import { FORMATIONS } from "./js/formations.js";
  import { drawArrow } from "./js/skydiver.js";

  const SAMPLES = [["J", 0, "J"], ["M", 0, "M"], ["14", 1, "Bloc 14 – inter"], ["1", 2, "Bloc 1 – arrivée"]];

  function tile(label, build) {
    const t = document.createElement("div");
    t.className = "tile";
    const f = document.createElement("div");
    f.className = "frame";
    const svg = el("svg", { viewBox: "0 0 480 480" }, f);
    build(svg);
    const s = document.createElement("small");
    s.textContent = label;
    t.append(f, s);
    return t;
  }

  const root = document.getElementById("designs");
  DESIGNS.forEach((d, i) => {
    const sec = document.createElement("section");
    sec.className = "design";
    sec.innerHTML = `<h2><span>${i + 1}.</span>${d.name}</h2><p>${d.desc}</p>`;
    const row = document.createElement("div");
    row.className = "row";
    row.append(tile("Modèle seul", (svg) => {
      svg.setAttribute("viewBox", "-100 -100 200 200");
      drawJumperWith(d, svg, { c: "blue", x: 0, y: 8, r: 0 });
    }));
    for (const [id, k, label] of SAMPLES) {
      row.append(tile(label, (svg) => {
        const frame = FORMATIONS[id][k];
        for (const j of frame.jumpers) drawJumperWith(d, svg, j);
        for (const a of frame.arrows ?? []) drawArrow(svg, a);
      }));
    }
    sec.append(row);
    root.append(sec);
  });
</script>
</body>
</html>
